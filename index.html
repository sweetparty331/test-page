<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Daily Pulse｜AI大佬动态速览</title>
  <link rel="stylesheet" href="style.css?v=20260601-card-header">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark">AI</div>
      <div>
        <h1>AI Daily Pulse</h1>
        <p>AI大佬动态速览</p>
      </div>
    </div>
    <div class="topbar-actions">
      <span id="updatedAt" class="updated-at">等待更新</span>
      <button id="refreshButton" class="button" type="button">刷新</button>
      <button id="settingsButton" class="button button-ghost" type="button">设置</button>
    </div>
  </header>

  <main class="layout">
    <aside class="sidebar" aria-label="资讯筛选">
      <section class="filter-group">
        <h2>关注分组</h2>
        <div id="groupFilters" class="filter-list"></div>
      </section>

      <section class="filter-group">
        <h2>内容类型</h2>
        <div id="categoryFilters" class="filter-list"></div>
      </section>

      <section class="filter-group">
        <h2>时间范围</h2>
        <div class="filter-list">
          <button class="filter-chip" data-date="today" type="button">今日</button>
          <button class="filter-chip" data-date="3d" type="button">近3日</button>
          <button class="filter-chip active" data-date="30d" type="button">近30日</button>
        </div>
      </section>

      <section class="source-status" aria-label="已接入信息源">
        <div>
          <h2>信息源</h2>
          <p id="sourceSummary">正在统计来源...</p>
        </div>
        <button id="sourceDetailsButton" class="text-button" type="button">查看全部</button>
      </section>
    </aside>

    <section class="feed-panel" aria-live="polite">
      <div class="feed-head">
        <div>
          <p class="eyebrow">今日重点</p>
          <h2>3秒扫完 AI 动态</h2>
        </div>
        <p id="resultCount" class="result-count">0 条</p>
      </div>

      <div class="feed-tools" aria-label="搜索和收藏">
        <label class="search-box">
          <span>搜索</span>
          <input id="searchInput" type="search" placeholder="搜索公司、标题、摘要或关键词">
        </label>
        <button id="favoritesToggle" class="button button-ghost" type="button">只看收藏</button>
      </div>

      <section id="overviewPanel" class="overview-panel hidden" aria-label="今日总览"></section>

      <div id="stateMessage" class="state-message">正在拉取干净资讯...</div>
      <div id="cardList" class="card-list"></div>
    </section>
  </main>

  <dialog id="settingsDialog" class="settings-dialog">
    <form method="dialog">
      <div class="dialog-head">
        <h2>关注源设置</h2>
        <button class="icon-button" value="close" aria-label="关闭设置" type="submit">×</button>
      </div>
      <p class="dialog-note">首版不直接写入配置文件；这里展示当前 `config.json` 中的来源，方便部署前检查。</p>
      <div id="sourceList" class="source-list"></div>
    </form>
  </dialog>

  <footer class="footer">
    自动每日更新｜数据来源公开 RSS｜无广告
  </footer>

  <script src="app.js?v=20260601-card-header" defer></script>
</body>
</html>
