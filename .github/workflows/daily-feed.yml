name: Generate Daily Feed

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Generate feed snapshot
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL }}
          ENABLE_X_FEEDS: ${{ vars.ENABLE_X_FEEDS }}
          X_STATUS_API_BASE: ${{ vars.X_STATUS_API_BASE }}
          RSSHUB_BASE_URL: ${{ vars.RSSHUB_BASE_URL }}
        run: node scripts/generateDailyFeed.js

      - name: Commit snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest.json data/daily/*.json
          if git diff --cached --quiet; then
            echo "No snapshot changes."
          else
            git commit -m "Update daily feed snapshot"
            git push
          fi
